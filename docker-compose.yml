services:
  dashboard:
    build: .
    environment:
      # SQLite on the volume by default; docker-compose.postgres.yml switches to PostgreSQL.
      AGENTMESH_DB_URL: ${AGENTMESH_DB_URL:-/data/agentmesh.db}
      AGENTMESH_DEMO_SEED: ${AGENTMESH_DEMO_SEED:-true}
      # Set both in a .env file (or your shell) before exposing the port beyond this machine.
      AGENTMESH_AUTH_MODE: ${AGENTMESH_AUTH_MODE:-none}
      AGENTMESH_API_KEY: ${AGENTMESH_API_KEY:-}
      AGENTMESH_CAPTURE_CONTENT: ${AGENTMESH_CAPTURE_CONTENT:-true}
      AGENTMESH_MAX_OTLP_BYTES: ${AGENTMESH_MAX_OTLP_BYTES:-33554432}
      AGENTMESH_ALERT_INTERVAL_SECONDS: ${AGENTMESH_ALERT_INTERVAL_SECONDS:-60}
      AGENTMESH_PUBLIC_URL: ${AGENTMESH_PUBLIC_URL:-}
    command: >
      sh -c "if [ \"$$AGENTMESH_DEMO_SEED\" != \"false\" ]; then
        agentmesh demo seed --reset;
      fi;
      agentmesh dashboard --host 0.0.0.0 --port 8787"
    ports:
      # Published on localhost only: auth is off by default. Use "8787:8787" to expose it,
      # together with AGENTMESH_AUTH_MODE=api_key and AGENTMESH_API_KEY.
      - "127.0.0.1:8787:8787"
    volumes:
      - agentmesh-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=5).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  agentmesh-data:
